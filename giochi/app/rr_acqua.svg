<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Roulette russa dentro Discord: una pistola AD ACQUA giocattolo (canna in su, verso l'avversario). Disegno originale. -->
  <defs>
    <linearGradient id="arancio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
    <linearGradient id="ciano" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="viola" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="acqua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".85"/><stop offset="1" stop-color="#0284c7" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <!-- goccia sulla punta -->
  <path d="M100 0 C93 9 91 13 91 17 a9 9 0 0 0 18 0 C109 13 107 9 100 0z" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
  <!-- ugello -->
  <rect x="88" y="22" width="24" height="18" rx="5" fill="#facc15" stroke="#7c2d12" stroke-width="3"/>
  <!-- canna -->
  <rect x="80" y="36" width="40" height="96" rx="14" fill="url(#ciano)" stroke="#164e63" stroke-width="4"/>
  <rect x="88" y="44" width="7" height="78" rx="3.5" fill="#ecfeff" opacity=".75"/>
  <circle cx="108" cy="60" r="4" fill="#0e7490"/><circle cx="108" cy="80" r="4" fill="#0e7490"/><circle cx="108" cy="100" r="4" fill="#0e7490"/>
  <!-- serbatoio laterale -->
  <rect x="122" y="96" width="56" height="78" rx="22" fill="url(#acqua)" stroke="#075985" stroke-width="4"/>
  <path d="M128 132 q12 -8 24 0 t22 0 v30 a16 16 0 0 1 -16 10 h-14 a16 16 0 0 1 -16 -10z" fill="#0ea5e9" opacity=".55"/>
  <circle cx="140" cy="118" r="5" fill="#fff" opacity=".8"/><circle cx="160" cy="146" r="3.5" fill="#fff" opacity=".7"/><circle cx="150" cy="160" r="2.5" fill="#fff" opacity=".7"/>
  <rect x="130" y="102" width="8" height="40" rx="4" fill="#fff" opacity=".45"/>
  <!-- corpo -->
  <rect x="58" y="118" width="84" height="74" rx="22" fill="url(#arancio)" stroke="#7c2d12" stroke-width="4"/>
  <rect x="68" y="126" width="54" height="10" rx="5" fill="#ffd8a8" opacity=".8"/>
  <circle cx="122" cy="168" r="9" fill="#facc15" stroke="#7c2d12" stroke-width="3"/>
  <!-- grilletto -->
  <path d="M84 190 q-6 22 10 30" fill="none" stroke="#7c2d12" stroke-width="9" stroke-linecap="round"/>
  <path d="M84 190 q-6 22 10 30" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <!-- impugnatura -->
  <path d="M100 184 L134 184 L128 284 Q127 296 114 296 L96 296 Q84 296 86 284 Z" fill="url(#viola)" stroke="#3b0764" stroke-width="4" stroke-linejoin="round"/>
  <path d="M102 206 h22 M101 226 h22 M100 246 h22 M99 266 h22" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- faccina buffa sul corpo -->
  <circle cx="80" cy="156" r="4.5" fill="#1f2937"/><circle cx="98" cy="156" r="4.5" fill="#1f2937"/>
  <path d="M80 168 q9 8 18 0" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
</svg>
